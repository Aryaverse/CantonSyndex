# Canton Participant — GlobalLeadBank (Lead Agent)
# Hosts: borrower party, agent party
# Ledger API port: 10011 | Admin API: 10012 | HTTP JSON: 10013

canton {
  participants {
    agent_participant {
      storage {
        type = memory
        # Production: use postgres
      }

      ledger-api {
        address = "0.0.0.0"
        port = 10011
        user-management-service {
          enabled = true
          cache-expiry-after-write-in-seconds = 5
        }
        # JWT auth (disabled for LocalNet — enable for client deployment)
        # auth-services = [{
        #   type = jwt-rs-256-jwks
        #   url = "https://your-auth-server/.well-known/jwks.json"
        # }]
      }

      admin-api {
        address = "0.0.0.0"
        port = 10012
      }

      http-ledger-api-experimental {
        server {
          address = "0.0.0.0"
          port = 10013
        }
        # Cors for frontend dashboard
        cors {
          allowed-origins = ["http://localhost:3000", "http://localhost:5500"]
        }
      }

      init {
        auto-init = true
        identity {
          node-identifier {
            type = explicit
            name = "agent-participant"
          }
        }
        ledger-api {
          max-deduplication-duration = 30m
        }
      }

      parameters {
        ledger-time-record-time-tolerance = 60s
        max-unzipped-data-size = 10485760
      }
    }
  }

  # Connect to the Canton Synchronizer
  remote-synchronizers {
    cantonsyndex_sync {
      domain-alias = "cantonsyndex"
      address = "canton-sync:9018"
      # tls {} for production
    }
  }

  monitoring {
    health {
      server {
        address = "0.0.0.0"
        port = 10014
      }
    }
  }
}
