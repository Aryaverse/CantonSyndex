# Canton Synchronizer Configuration — CantonSyndex LocalNet
# The synchronizer orders transactions and validates cryptographic commitments.
# It NEVER sees contract payloads — only encrypted commitment hashes.

canton {
  synchronizers {
    cantonsyndex_sync {
      storage {
        type = memory
        # For production: switch to postgres
        # type = postgres
        # config { url = "jdbc:postgresql://postgres:5432/canton_sync" ... }
      }

      public-api {
        address = "0.0.0.0"
        port = 9018
        tls {}  # Disabled for LocalNet; enable for production
      }

      admin-api {
        address = "0.0.0.0"
        port = 9019
      }

      # Participant connection permissions (allow all for LocalNet)
      init {
        auto-init = true
        identity {
          node-identifier {
            type = explicit
            name = "cantonsyndex-synchronizer"
          }
        }
      }

      parameters {
        # Maximum transaction size (bytes)
        max-request-size = 10485760  # 10 MB

        # Ledger time parameters
        ledger-time-record-time-tolerance = 60s
        reconciliation-interval = 5s
      }
    }
  }

  monitoring {
    health {
      server {
        address = "0.0.0.0"
        port = 9020
      }
    }
  }
}
