# Canton Participant — BetaBank
# Hosts: bankB party + TrancheParticipation contracts (BetaBank only)
# Ledger API port: 10031 | Admin API: 10032 | HTTP JSON: 10033
#
# PRIVACY GUARANTEE: This node stores ONLY contracts where bankB is a party.
# AlphaBank's participant node (canton-banka) has zero access to this node's data.

canton {
  participants {
    bankb_participant {
      storage {
        type = memory
      }

      ledger-api {
        address = "0.0.0.0"
        port = 10031
        user-management-service {
          enabled = true
          cache-expiry-after-write-in-seconds = 5
        }
      }

      admin-api {
        address = "0.0.0.0"
        port = 10032
      }

      http-ledger-api-experimental {
        server {
          address = "0.0.0.0"
          port = 10033
        }
        cors {
          allowed-origins = ["http://localhost:3000", "http://localhost:5500"]
        }
      }

      init {
        auto-init = true
        identity {
          node-identifier {
            type = explicit
            name = "bankb-participant"
          }
        }
        ledger-api {
          max-deduplication-duration = 30m
        }
      }

      parameters {
        ledger-time-record-time-tolerance = 60s
        max-unzipped-data-size = 10485760
      }
    }
  }

  remote-synchronizers {
    cantonsyndex_sync {
      domain-alias = "cantonsyndex"
      address = "canton-sync:9018"
    }
  }

  monitoring {
    health {
      server {
        address = "0.0.0.0"
        port = 10034
      }
    }
  }
}
