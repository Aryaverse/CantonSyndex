# Canton Participant — AlphaBank
# Hosts: bankA party + TrancheParticipation contracts (AlphaBank only)
# Ledger API port: 10021 | Admin API: 10022 | HTTP JSON: 10023
#
# PRIVACY GUARANTEE: This node stores ONLY contracts where bankA is a party.
# BetaBank's participant node (canton-bankb) has zero access to this node's data.

canton {
  participants {
    banka_participant {
      storage {
        type = memory
      }

      ledger-api {
        address = "0.0.0.0"
        port = 10021
        user-management-service {
          enabled = true
          cache-expiry-after-write-in-seconds = 5
        }
      }

      admin-api {
        address = "0.0.0.0"
        port = 10022
      }

      http-ledger-api-experimental {
        server {
          address = "0.0.0.0"
          port = 10023
        }
        cors {
          allowed-origins = ["http://localhost:3000", "http://localhost:5500"]
        }
      }

      init {
        auto-init = true
        identity {
          node-identifier {
            type = explicit
            name = "banka-participant"
          }
        }
        ledger-api {
          max-deduplication-duration = 30m
        }
      }

      parameters {
        ledger-time-record-time-tolerance = 60s
        max-unzipped-data-size = 10485760
      }
    }
  }

  remote-synchronizers {
    cantonsyndex_sync {
      domain-alias = "cantonsyndex"
      address = "canton-sync:9018"
    }
  }

  monitoring {
    health {
      server {
        address = "0.0.0.0"
        port = 10024
      }
    }
  }
}
